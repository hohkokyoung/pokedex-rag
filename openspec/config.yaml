schema: spec-driven

# Project context: constraints an agent can't infer from the code alone.
# Architecture, commands and conventions live in CLAUDE.md — read it first.
context: |
  Single-user, local-only app with no auth. Pokémon data is pre-ingested from
  PokéAPI CSVs into Postgres; never call PokéAPI (or any other data API) at runtime.

  LLM provider: the running setup uses Groq (openai/gpt-oss-120b) because no
  Anthropic key is set. Anything LLM-driven must work on BOTH Groq
  (OpenAI-style tools / strict json_schema) and Anthropic, be tuned for Groq, and
  respect Groq's free-tier tokens-per-minute limit: keep LLM calls per request
  small and bounded, and treat a 429 as a signal to fall back, not to retry in a loop.

  Grounding is non-negotiable: answers use ONLY retrieved context (RetrievedChunk),
  cite it as [n], and abstain when the data can't answer. The LLM may choose what
  to retrieve, but facts, names and numbers come from the database. Ranking/count
  answers are rendered from data by code, not written by the LLM.

  Every LLM feature needs a keyless / rate-limited fallback that still returns
  something useful from the data (heuristic routing, extractive answers).

  Nothing that changes the user's teams or calc state is applied without an
  explicit click or an explicit imperative command ("add X"); the assistant only
  proposes, and each proposal is validated against legal data (learnsets,
  abilities, natures, items) before it is shown.

  UI: the light "Instrument" data-lab theme; respect prefers-reduced-motion; GSAP
  only for high-impact moments. The user prefers decisive designs over many options.

rules:
  proposal:
    - State what is out of scope
    - Keep one change per shippable phase; don't bundle surfaces (Ask / team coach / calc coach) unless asked
  design:
    - Name the existing modules/services reused, and say what (if anything) becomes fallback-only or is removed
    - Give a per-request LLM call and token budget for any LLM-driven flow
  specs:
    - Write scenarios as testable WHEN/THEN, including the no-key and rate-limited paths
  tasks:
    - Include backend tests (pytest) and, for retrieval/coach changes, eval dataset updates (backend/eval)
    - End with updating CLAUDE.md when architecture or conventions change

operations:
  apply:
    guidance:
      - Run make test and make lint before ticking a task group off; run make eval for retrieval/coach changes
      - Data pipeline scripts run on the host against the Compose DB (host port 5433)
  archive:
    guidance:
      - Summarize the archive outcome before finishing
