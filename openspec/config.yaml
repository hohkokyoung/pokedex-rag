schema: spec-driven

# Project context for planning. The rules that hold everywhere (no runtime PokéAPI,
# grounded answers, keyless fallbacks, gated writes, LLM budget) are in CLAUDE.md,
# and each area's doc + spec is listed there — read it first. Only what CLAUDE.md
# doesn't say lives here.
context: |
  LLM features must work on BOTH providers — Groq (strict json_schema; the running
  setup) and Anthropic (forced tool call) — and be tuned for Groq's free-tier
  tokens-per-minute limit.

  Every proposal the assistant shows (sets, builds, additions) is validated against
  legal data (learnsets, abilities, natures, items) before it is shown.

  UI follows the light "Instrument" data-lab theme. The user prefers decisive
  designs over many options.

rules:
  proposal:
    - State what is out of scope
    - Keep one change per shippable phase; don't bundle surfaces (Ask / team coach / calc coach) unless asked
  design:
    - Name the existing modules/services reused, and say what (if anything) becomes fallback-only or is removed
    - List the docs/ pages this change affects
    - Give a per-request LLM call and token budget for any LLM-driven flow
  specs:
    - Write scenarios as testable WHEN/THEN, including the no-key and rate-limited paths
  tasks:
    - Include backend tests (pytest) and, for retrieval/coach changes, eval dataset updates (backend/eval)
    - "End with a docs task: update the docs/architecture pages the change touches, the docs/product page and README feature list if it's user-visible, and CLAUDE.md only for new conventions or gotchas"

operations:
  apply:
    guidance:
      - Run make test and make lint before ticking a task group off; run make eval for retrieval/coach changes
      - Data pipeline scripts run on the host against the Compose DB (host port 5433)
  archive:
    guidance:
      - Before archiving, check that the docs/ pages named in design.md still match the code; fix any drift in the same change
      - Summarize the archive outcome before finishing
