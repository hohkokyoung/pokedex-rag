# Full-stack local development stack: Postgres (pgvector) + FastAPI + Next.js.
# Usage:
#   cp .env.example .env
#   docker compose up --build

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pokedex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pokedex}
      POSTGRES_DB: ${POSTGRES_DB:-pokedex}
    ports:
      # Host 5433 -> container 5432, avoiding conflicts with a local Postgres.
      # Backend<->db traffic uses the internal network on 5432 regardless.
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pokedex} -d ${POSTGRES_DB:-pokedex}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://pokedex:pokedex@db:5432/pokedex}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      SPRITES_DIR: /data/sprites
      # LLM providers (from .env) — the assistant uses Anthropic if set, else Groq.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-5}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
    ports:
      - "${BACKEND_HOST_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Bind-mount source for reload; keep the container's virtualenv.
      - ./backend:/app
      - /app/.venv
      # Read-only access to downloaded data (sprites served as static files).
      - ./data:/data:ro
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
      WATCHPACK_POLLING: "true"
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:3000"
    depends_on:
      - backend
    volumes:
      # Bind-mount source for hot reload; keep the container's node_modules/.next.
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

volumes:
  pgdata:
