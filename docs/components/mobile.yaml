name: mobile
description: The Flutter app (iOS/Android) — Pokédex, Teams with their coach, Ask and Tools, read from the backend on the home network.

code:
  - mobile/lib/
  - mobile/test/
  - mobile/openapi.json            # the backend schema slice the app is generated from
  - mobile/swagger_parser.yaml
  - mobile/ios/Runner/Info.plist   # local-network HTTP + permission reason
  - mobile/android/app/src/main/res/xml/network_security_config.xml
  - tools/mobile/openapi_snapshot.py
  - tools/mobile/gen_tokens.py
  - backend/tests/test_mobile_openapi.py

documentation:
  - docs/product/mobile.md
  - docs/guides/mobile.md

specs:
  - openspec/specs/mobile/

decisions:
  - docs/decisions/ADR-009.md
  - docs/decisions/ADR-010.md

depends_on:
  - pokedex
  - team-coach
  - ask-agent

interfaces:
  - uses GET /api/pokemon, GET /api/pokemon/{id_or_name}, GET /api/types, GET /api/types/chart, GET /api/generations, GET /health
  - uses GET /api/pokemon/{pokemon_id}/moves/by-game, GET /api/moves/{move_id}/learners/by-game, GET /api/pokemon/{pokemon_id}/encounters
  - uses GET /api/profile, POST|DELETE /api/profile/favorites/{pokemon_id}
  - uses the teams API (CRUD, slots, build, analysis, strategy, summary/refresh) and the builder lookups (moves, abilities, items, natures)
  - uses POST /api/ask/stream (SSE; typed views from the /api/ask schema), GET /api/ask/status, PUT /api/profile
  - uses POST /api/teams/{team_id}/ask (SSE, the team coach; same reader as Ask, plus team_updated)
  - uses POST /api/calc/turn, GET /api/calc/options (the damage calculator)
  - uses GET /api/pokemon/{pokemon_id}/catch, /api/moves, /api/abilities, /api/abilities/{ability_id}/pokemon, /api/items, /api/natures (Tools)
